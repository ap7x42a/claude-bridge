name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Provide the runtime's fixed Node path
        run: |
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
          /usr/bin/node --version
      - run: npm ci
      - run: npm test
